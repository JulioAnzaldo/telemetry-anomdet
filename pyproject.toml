[project]
name = "telemetry-anomdet"
version = "0.2.0"
description = "Spacecraft telemetry anomaly detection: classical and graph deep detectors, label-free thresholding, and distillation to C for flight hardware."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Julio Anzaldo", email = "anzaldojuliojesus@gmail.com" }
]
dependencies = [
  "pandas>=2.2.2,<3.0.0",
  "numpy>=2.1,<3.0",
  "scikit-learn>=1.3,<2.0",
  "typing-extensions>=4.16.0",
]
keywords = ["telemetry", "anomaly-detection", "machine-learning", "python"]
# License is declared as an SPDX expression above, not a classifier: license
# classifiers are deprecated and setuptools warns on them.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  # The toolkit is pure Python; the artifact it generates for flight targets is C.
  "Programming Language :: C",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Code Generators",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

[project.optional-dependencies]
ccsds = [
  "ccsdspy>=2.0.0,<3.0",
]
# Phase 2 deep detectors (GDN, TranAD). Optional so the base install stays
# torch-free; torch is imported lazily at fit time.
deep = [
  "torch>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "pre-commit>=4.6.1,<5.0",
  "black>=26.5.1,<27.0",
  "ruff>=0.16.0,<1.0",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "sphinx-autodoc-typehints>=2.0",
  "numpydoc>=1.7",
  "sphinx-sitemap>=2.6",
  "sphinxext-opengraph>=0.9",
  "sphinx-notfound-page>=1.0",
]
# Phase 3
# xai = [
#   "shap",
# ]
# Phase 4
# llm = [
#   "fastapi",
#   "uvicorn",
#   "httpx",
# ]

[project.urls]
Homepage = "https://github.com/JulioAnzaldo/telemetry-anomdet"
Repository = "https://github.com/JulioAnzaldo/telemetry-anomdet"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",  # line length handled by the formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["telemetry_anomdet"]
branch = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["telemetry_anomdet*"]

[tool.setuptools.package-data]
telemetry_anomdet = ["py.typed"]