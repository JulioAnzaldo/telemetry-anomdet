name: CI
permissions:
  contents: read
  
on:
  pull_request:
    branches: [ main, dev, feature/** ]
  push:
    branches: [ main, dev, feature/** ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check src tests examples

      - name: Ruff format check
        run: uv run ruff format --check src tests examples

  tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q --cov --cov-report=term-missing

  deep-tests:
    name: Deep Detector Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The deep extra pulls torch. Install it on a single Python version so the
      # torch-backed detectors (GDN, KANGDN, ...) are actually exercised rather
      # than skipped via importorskip, without adding torch to the 4-version
      # matrix.
      - name: Install dependencies (with deep extra)
        run: uv sync --group dev --extra deep

      # Covers the whole chain the deep extra unlocks: the detectors, the
      # torch-free distillation, and the generated C. The codegen tests compile
      # the emitted sources and check them against golden vectors, so they need
      # a C compiler; ubuntu-latest ships gcc, and they self-skip without one.
      - name: Run deep detector tests
        run: uv run pytest -q tests/test_deep_kan.py tests/test_deep_gdn.py tests/test_deep_kangdn.py tests/test_deep_smoothing.py tests/test_deep_distill.py tests/test_deep_codegen.py

  docs:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group docs --extra ccsds

      - name: Build Sphinx docs
        run: uv run sphinx-build -b html docs/source docs/build/html